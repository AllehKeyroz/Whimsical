# Optional: one-shot deployment of the web app + collaboration relay.
# Easypanel can also run these as two separate "App" services; see README.
#
#   VITE_SUPABASE_URL=... VITE_SUPABASE_ANON_KEY=... docker compose up -d --build
#
# The VITE_* values are baked into the static bundle, so a credential change
# requires a rebuild (or set them at runtime in the app's "Nuvem" panel).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    restart: unless-stopped

  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    ports:
      - "8787:8787"
    restart: unless-stopped
