server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  client_max_body_size 25m;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

  # `add_header` is not inherited by locations that define their own headers,
  # so the shared security headers are included both here and in those blocks.
  include /etc/nginx/security-headers.conf;

  # Health check used by Easypanel / Docker.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change: cache them aggressively.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # The shell and the service worker must always be revalidated, otherwise a
  # deploy can keep serving an index.html that points to deleted chunks.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/security-headers.conf;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/security-headers.conf;
  }

  location = /manifest.webmanifest {
    # `.webmanifest` is not in nginx's MIME table; default_type covers it
    # without replacing the inherited types map.
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # SPA fallback: /#/... routes and deep links resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
