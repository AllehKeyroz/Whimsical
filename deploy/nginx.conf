server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  client_max_body_size 25m;

  # .webmanifest is not in the default nginx MIME table, so extend the map.
  # The include is required: defining `types` at server level replaces the
  # inherited table, and without it .js/.css/.html would lose their types.
  types {
    include /etc/nginx/mime.types;
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

  # `add_header` is not inherited by locations that define their own headers,
  # so the shared security headers are included both here and in those blocks.
  include /etc/nginx/security-headers.conf;

  # Health check used by Easypanel / Docker.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change: cache them aggressively.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # The shell and the service worker must always be revalidated, otherwise a
  # deploy can keep serving an index.html that points to deleted chunks.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/security-headers.conf;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/security-headers.conf;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # SPA fallback: /#/... routes and deep links resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
